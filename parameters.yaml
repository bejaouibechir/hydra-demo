version: "1.0"
parameters:
  mysql_host:
    type: string
    default: 127.0.0.1
    description: MySQL host. 'mysql' inside the devcontainer network.
  mysql_port:
    type: string
    default: "3307"
    description: MySQL port.
  mysql_database:
    type: string
    default: orders_dev
    description: Target database.
  min_amount:
    type: float
    default: 500
    description: Orders below this amount are dropped from the report.
  run_label:
    type: string
    default: dev
    description: Written into the report file name.
